  {month:3,emoji:"🍚",kcal:269,
    name:{zh:"健康蔬菜粥",en:"Healthy Vegetable Congee",fil:"Malusog na Lugaw na Gulay",id:"Bubur Sayur Sehat"},
    ing:{zh:"洋蔥1/4個(切丁)、胡蘿蔔20克(切丁)、高麗菜60克(小片)、豆皮1/2片(切小塊)、植物油1茶匙、豬絞肉70克、胚芽米1/2米杯、芹菜末少許、水3杯、鹽少許、醬油少許、胡椒粉少許",en:"Onion 1/4 diced, carrot 20g diced, cabbage 60g, tofu skin 1/2 piece diced, 1 tsp oil, ground pork 70g, 1/2 cup germ rice, celery, 3 cups water, salt, soy sauce, pepper",fil:"Sibuyas, carrot, repolyo, tokwa skin, langis, giniling na baboy, bigas, kintsay, tubig, asin, toyo, paminta",id:"Bawang bombay, wortel, kubis, kulit tahu, minyak, daging cincang, beras germ, seledri, air, garam, kecap, merica"},
    method:{zh:"洋蔥、胡蘿蔔切丁，高麗菜切小片，芹菜切末，豆皮切小塊。鍋中加油炒洋蔥至透明，加豬絞肉、胡蘿蔔、豆皮炒熟，加鹽及醬油調味。胚芽米洗淨加3杯水入電鍋，加入炒料及高麗菜，煮熟後加胡椒粉、芹菜末即可。",en:"Dice onion and carrot, shred cabbage, mince celery, dice tofu skin. Sauté onion until translucent, add pork, carrot, tofu skin, season with salt and soy sauce. Rinse germ rice with 3 cups water in rice cooker, add the sautéed mix and cabbage, cook, then finish with pepper and celery.",fil:"Tadtarin ang sibuyas, carrot, repolyo, kintsay, tokwa. Igisa ang sibuyas, idagdag ang baboy, carrot, tokwa, timplahan. Lutuin ang bigas na may 3 tasang tubig, idagdag ang gisado at repolyo, lutuin, tapusin ng paminta at kintsay.",id:"Potong dadu bawang bombay dan wortel, iris kubis, cincang seledri, potong kulit tahu. Tumis bawang hingga bening, tambahkan daging, wortel, kulit tahu, bumbui. Masak beras germ dengan 3 cangkir air di rice cooker, tambahkan tumisan dan kubis, masak, akhiri dengan merica dan seledri."},
    note:{zh:"粥品對長者而言是容易入口的餐點。高麗菜、洋蔥、胡蘿蔔等可增加纖維攝取。亦可用燕麥代替部分胚芽米，增加纖維質攝取。",en:"Congee is easy to eat for elders. Cabbage, onion, and carrot add fiber. You can replace part of the rice with oats for more fiber.",fil:"Madaling kainin ng matatanda ang lugaw. Nagdadagdag ng fiber ang repolyo, sibuyas, carrot. Puwedeng palitan ng oats ang bahagi ng bigas.",id:"Bubur mudah dimakan lansia. Kubis, bawang bombay, wortel menambah serat. Sebagian beras bisa diganti oat untuk tambahan serat."}},
  {month:4,emoji:"🌿",kcal:315,
    name:{zh:"塔塔香肉燥飯",en:"Thai Basil Minced Pork Rice",fil:"Kaning may Giniling at Basil",id:"Nasi Daging Cincang Kemangi"},
    ing:{zh:"杏鮑菇30克(切丁)、蒜頭1顆(切碎)、九層塔10克(切碎)、豬絞肉70克、胚芽米飯1.5碗、白芝麻少許、植物油1茶匙、醬油1茶匙、米酒少許、糖少許",en:"King oyster mushroom 30g diced, 1 minced garlic clove, Thai basil 10g minced, ground pork 70g, 1.5 bowls germ rice, sesame seeds, 1 tsp oil, 1 tsp soy sauce, wine, sugar",fil:"King oyster mushroom, bawang, basil, giniling na baboy, kanin, sesame seeds, langis, toyo, alak, asukal",id:"Jamur king oyster, bawang putih, kemangi, daging cincang, nasi, wijen, minyak, kecap, arak, gula"},
    method:{zh:"杏鮑菇切丁，蒜頭及九層塔切碎。鍋中加油炒香蒜末及九層塔，加豬絞肉、杏鮑菇拌炒均勻，加調味料調味。將炒料淋在胚芽米飯上，灑白芝麻即可食用。",en:"Dice the mushroom, mince garlic and basil. Sauté garlic and basil in oil, add pork and mushroom, stir-fry evenly, season. Spoon over rice and sprinkle with sesame seeds.",fil:"Tadtarin ang kabute, bawang, at basil. Igisa ang bawang at basil, idagdag ang baboy at kabute, timplahan. Ibuhos sa kanin, budburan ng sesame.",id:"Potong dadu jamur, cincang bawang putih dan kemangi. Tumis bawang dan kemangi, tambahkan daging dan jamur, aduk rata, bumbui. Siram di atas nasi, taburi wijen."},
    note:{zh:"九層塔的特殊香氣，再加上肉燥，可增加長者食慾。白芝麻含身體必需脂肪酸及豐富維生素E，具抗氧化作用，能增進皮膚健康。亦可用雞蛋代替豬絞肉，做成九層塔煎蛋。",en:"Basil's aroma with minced pork boosts elders' appetite. Sesame seeds provide essential fatty acids and vitamin E for skin health. You can replace pork with egg for a basil omelet.",fil:"Ang amoy ng basil at giniling ay nagpapataas ng gana ng matatanda. May essential fatty acids at Vitamin E ang sesame para sa balat. Puwedeng palitan ang baboy ng itlog.",id:"Aroma kemangi dengan daging cincang meningkatkan nafsu makan lansia. Wijen mengandung asam lemak esensial dan vitamin E untuk kulit. Daging bisa diganti telur untuk omelet kemangi."}},
  {month:5,emoji:"🍛",kcal:149,
    name:{zh:"咖哩菇菇歐姆蛋",en:"Curry Mushroom Omelet",fil:"Curry Mushroom Omelette",id:"Omelet Jamur Kari"},
    ing:{zh:"鮮香菇1朵(切絲)、金針菇20克、美白菇20克、雞蛋2個、蔥花少許、植物油2茶匙、洋蔥1/4顆、水200毫升、咖哩粉1茶匙、番茄醬2茶匙、鹽少許",en:"1 shiitake mushroom, enoki 20g, white beech mushroom 20g, 2 eggs, scallion, 2 tsp oil, 1/4 onion, 200ml water, 1 tsp curry powder, 2 tsp ketchup, salt",fil:"Kabute, itlog, sibuyas, tubig, curry powder, ketchup, asin",id:"Jamur shiitake, jamur enoki, jamur putih, telur, daun bawang, minyak, bawang bombay, air, bubuk kari, saus tomat, garam"},
    method:{zh:"菇類洗淨切絲；蛋打成蛋液加蔥花拌勻。用油炒香咖哩粉，加洋蔥、番茄醬及水煮滾成醬汁。鍋中炒菇，一半炒熟取出，另一半留鍋加鹽，倒入蛋液煎成蛋捲，淋上咖哩醬汁即可。",en:"Slice mushrooms. Beat eggs with scallion. Sauté curry powder, add onion, ketchup, and water to make sauce. Stir-fry mushrooms, set half aside; cook the rest with salt, pour in egg mixture and roll into an omelet, top with curry sauce.",fil:"Hiwain ang kabute. Paluin ang itlog na may sibuyas. Igisa ang curry powder, idagdag ang sibuyas, ketchup, tubig para sa sarsa. Igisa ang kabute, ihiwalay ang kalahati, lutuin ang natitira na may asin, ibuhos ang itlog, i-roll, budburan ng curry sauce.",id:"Iris jamur. Kocok telur dengan daun bawang. Tumis bubuk kari, tambahkan bawang, saus tomat, air untuk saus. Tumis jamur, sisihkan separuh, masak sisanya dengan garam, tuang telur, gulung jadi omelet, siram saus kari."},
    note:{zh:"咖哩在炎熱夏天可刺激長者食慾，薑黃素具抗發炎效果。搭配米飯、蔬菜食用可攝取多種營養素。亦可用新鮮番茄代替菇類，做出茄汁歐姆蛋。",en:"Curry stimulates appetite in hot summer; curcumin has anti-inflammatory effects. Pair with rice and vegetables for balanced nutrition. You can use fresh tomato instead of mushrooms for a tomato omelet.",fil:"Nagpapataas ng gana ang curry sa tag-init; may anti-inflammatory ang curcumin. Isama sa kanin at gulay. Puwedeng gamitin ang sariwang kamatis kapalit ng kabute.",id:"Kari merangsang nafsu makan di musim panas; kurkumin bersifat anti-inflamasi. Padukan dengan nasi dan sayur. Bisa ganti jamur dengan tomat segar untuk omelet tomat."}},
  {month:6,emoji:"🍆",kcal:109,
    name:{zh:"味噌茄子",en:"Miso Eggplant",fil:"Miso Talong",id:"Terong Miso"},
    ing:{zh:"茄子2條(約200克)、橄欖油1茶匙、白芝麻1大匙、水3/4杯、味噌1大匙、細砂糖少許、開水1.5大匙",en:"2 eggplants (~200g), 1 tsp olive oil, 1 tbsp sesame seeds, 3/4 cup water, 1 tbsp miso, sugar, 1.5 tbsp water",fil:"Talong, olive oil, sesame seeds, tubig, miso, asukal",id:"Terong, minyak zaitun, wijen, air, miso, gula"},
    method:{zh:"茄子洗淨切長段，斜切十字花後排入盤中，淋上橄欖油。放電鍋外鍋加3/4杯水蒸熟，開關跳起後立即取出。混合味噌醬料，與茄子拌勻，灑白芝麻即可。",en:"Cut eggplant into segments, score a crosshatch, arrange on a plate, drizzle with olive oil. Steam with 3/4 cup water until done, remove immediately when finished. Mix the miso sauce, toss with eggplant, sprinkle sesame seeds.",fil:"Hiwain ang talong, guhitan ng crosshatch, ilagay sa plato, budburan ng olive oil. I-steam gamit ang 3/4 tasang tubig, alisin agad pagkatapos. Ihalo ang miso sauce sa talong, budburan ng sesame.",id:"Potong terong, iris silang, susun di piring, siram minyak zaitun. Kukus dengan 3/4 cangkir air hingga matang, angkat segera. Campur saus miso dengan terong, taburi wijen."},
    note:{zh:"茄子含維生素A、B群、C等，紫色外皮含多酚類抗氧化物。蒸過的茄子質地較軟，適合咀嚼困難長者食用。味噌含優良蛋白質、大豆異黃酮、卵磷脂等營養素。",en:"Eggplant provides vitamins A, B, C; the purple skin contains antioxidant polyphenols. Steamed eggplant is soft, suitable for those with chewing difficulty. Miso offers quality protein, isoflavones, and lecithin.",fil:"May Vitamin A, B, C ang talong; may antioxidant sa balat nito. Malambot ang steamed na talong, angkop sa may hirap ngumuya. May mataas na kalidad na protina ang miso.",id:"Terong mengandung vitamin A, B, C; kulit ungunya kaya antioksidan. Terong kukus lembut, cocok untuk yang sulit mengunyah. Miso mengandung protein berkualitas dan isoflavon."}},
  {month:7,emoji:"🥬",kcal:88,
    name:{zh:"秋葵豆腐",en:"Okra & Tofu",fil:"Okra at Tokwa",id:"Okra & Tahu"},
    ing:{zh:"豆腐1盒、秋葵12根(約100克)、蒜末少許、紅辣椒末少許、蔥花少許、鹽少許、醬油少許、糖少許、黑醋少許、香油少許",en:"1 box tofu, 12 okra (~100g), minced garlic, minced chili, scallion, salt, soy sauce, sugar, black vinegar, sesame oil",fil:"Tokwa, okra, bawang, sili, sibuyas na dahon, asin, toyo, asukal, black vinegar, sesame oil",id:"Tahu, okra, bawang putih, cabai, daun bawang, garam, kecap, gula, cuka hitam, minyak wijen"},
    method:{zh:"豆腐加鹽去水後切小塊，川燙備用。秋葵抹鹽去絨毛，川燙後橫切成星星狀。蒜末加醬油、糖、黑醋調成醬汁。碗中放秋葵、豆腐拌勻，淋上醬汁，加香油、紅辣椒末及蔥花拌勻即可。",en:"Salt tofu to draw out water, cube and blanch. Rub okra with salt to remove fuzz, blanch, and slice crosswise into star shapes. Mix garlic, soy sauce, sugar, black vinegar into a sauce. Combine okra and tofu, drizzle with sauce, add sesame oil, chili, and scallion.",fil:"Asinan ang tokwa, hiwain, iluto. Kuskusin ng asin ang okra, iluto, hiwain crosswise. Ihalo ang bawang, toyo, asukal, black vinegar. Ihalo ang okra at tokwa, budburan ng sesame oil, sili, sibuyas.",id:"Garami tahu untuk keluarkan air, potong dadu, rebus. Gosok okra dengan garam, rebus, potong melintang bentuk bintang. Campur bawang putih, kecap, gula, cuka hitam jadi saus. Campur okra dan tahu, siram saus, tambahkan minyak wijen, cabai, daun bawang."},
    note:{zh:"秋葵含鐵、鈣等多種微量營養素。豆腐是良好的植物性蛋白質，對咀嚼困難長者是容易入口的菜餚。亦可用西洋芹代替秋葵、干絲代替豆腐。",en:"Okra provides iron, calcium and other trace nutrients. Tofu is a good plant protein, easy to eat for those with chewing difficulty. You can substitute celery for okra and dried tofu strips for tofu.",fil:"May iron, calcium ang okra. Magandang plant protein ang tokwa, madaling kainin ng may hirap ngumuya. Puwedeng gamitin ang celery kapalit ng okra.",id:"Okra kaya zat besi dan kalsium. Tahu adalah protein nabati yang baik, mudah dimakan bagi yang sulit mengunyah. Bisa ganti okra dengan seledri."}},
  {month:8,emoji:"🍜",kcal:255,
    name:{zh:"米苔目湯",en:"Rice Noodle Soup",fil:"Sopas na Rice Noodle",id:"Sup Mi Beras"},
    ing:{zh:"韭菜20克、蝦米5克、紅蔥頭少許、肉絲70克、米苔目(濕)200克、綠豆芽50克、鹽少許、麻油1茶匙",en:"Garlic chives 20g, dried shrimp 5g, shallot, shredded meat 70g, rice noodles (fresh) 200g, mung bean sprouts 50g, salt, 1 tsp sesame oil",fil:"Chives, dried shrimp, sibuyas, karne, rice noodles, toge, asin, sesame oil",id:"Kucai, udang kering, bawang merah, daging suwir, mi beras, tauge, garam, minyak wijen"},
    method:{zh:"韭菜洗淨切段。蝦米、紅蔥頭、肉絲炒香。米苔目放入滾水，加入炒料及綠豆芽煮滾，起鍋前加鹽及麻油即可。",en:"Cut chives into segments. Sauté dried shrimp, shallot, and shredded meat until fragrant. Boil rice noodles, add the sautéed mix and bean sprouts, season with salt and sesame oil before serving.",fil:"Hiwain ang chives. Igisa ang dried shrimp, sibuyas, karne. Pakuluan ang rice noodles, idagdag ang gisado at toge, timplahan ng asin at sesame oil.",id:"Potong kucai. Tumis udang kering, bawang merah, daging suwir. Rebus mi beras, tambahkan tumisan dan tauge, bumbui garam dan minyak wijen."},
    note:{zh:"米苔目是國內普遍食用的傳統米食，高齡者接受度高。亦可用粄條代替米苔目，適合做為高齡者的點心。",en:"Rice noodles are a common traditional dish, well accepted by elders. You can use flat rice noodles instead, suitable as a snack for elders.",fil:"Karaniwang tradisyonal na pagkain ang rice noodles, tinatanggap ng matatanda. Puwedeng gamitin ang flat rice noodles kapalit.",id:"Mi beras adalah makanan tradisional yang umum, mudah diterima lansia. Bisa diganti mi beras pipih sebagai camilan lansia."}},
  {month:9,emoji:"🥘",kcal:175,
    name:{zh:"皇宮菜麻油豬肝",en:"Malabar Spinach with Sesame Oil Pork Liver",fil:"Malabar Spinach na may Sesame Oil Liver",id:"Bayam Malabar Hati Babi Minyak Wijen"},
    ing:{zh:"皇宮菜200克、豬肝90克、麻油1大匙、薑片少許、米酒少許、鹽少許",en:"Malabar spinach 200g, pork liver 90g, 1 tbsp sesame oil, ginger, wine, salt",fil:"Malabar spinach, atay ng baboy, sesame oil, luya, alak, asin",id:"Bayam malabar, hati babi, minyak wijen, jahe, arak, garam"},
    method:{zh:"皇宮菜取嫩葉，豬肝切塊。麻油炒香薑片，加豬肝炒至略變色後盛起。鍋中放皇宮菜炒熟，加回豬肝，加米酒及鹽調味後熄火，燜3分鐘即可。",en:"Take tender Malabar spinach leaves, cube pork liver. Sauté ginger in sesame oil, add liver until it slightly changes color, set aside. Stir-fry spinach until cooked, add back the liver, season with wine and salt, turn off heat, rest 3 minutes.",fil:"Kunin ang malambot na dahon ng spinach, hiwain ang atay. Igisa ang luya sa sesame oil, idagdag ang atay hanggang magbago ang kulay, ilabas. Igisa ang spinach, ibalik ang atay, timplahan ng alak at asin, patayin ang apoy, hayaang 3 minuto.",id:"Ambil daun bayam malabar muda, potong hati babi. Tumis jahe dengan minyak wijen, tambahkan hati hingga berubah warna, sisihkan. Tumis bayam hingga matang, masukkan kembali hati, bumbui arak dan garam, matikan api, diamkan 3 menit."},
    note:{zh:"皇宮菜有滑溜口感，有助長者吞嚥，且富含纖維可促進腸道蠕動。豬肝富含鐵質，有助正常紅血球形成。亦可用紅棗代替皇宮菜、牛肉代替豬肝。",en:"Malabar spinach has a slippery texture that helps swallowing and is fiber-rich for gut motility. Pork liver is rich in iron for red blood cell formation. You can substitute red dates for spinach and beef for liver.",fil:"May malambot na texture ang spinach na tumutulong sa paglunok, mayaman sa fiber. Mayaman sa iron ang atay para sa red blood cells. Puwedeng palitan ng red dates at beef.",id:"Bayam malabar bertekstur licin membantu menelan, kaya serat untuk pencernaan. Hati babi kaya zat besi untuk pembentukan sel darah merah. Bisa ganti dengan kurma merah dan daging sapi."}},
  {month:10,emoji:"🐟",kcal:313,
    name:{zh:"茄汁秋刀魚",en:"Saury in Tomato Sauce",fil:"Saury sa Tomato Sauce",id:"Ikan Saury Saus Tomat"},
    ing:{zh:"秋刀魚2尾、番茄1碗(切丁)、洋蔥1/4顆、植物油2茶匙、米酒少許、糖少許、番茄醬2大匙",en:"2 Pacific saury, 1 bowl diced tomato, 1/4 onion, 2 tsp oil, wine, sugar, 2 tbsp ketchup",fil:"Saury, kamatis, sibuyas, langis, alak, asukal, ketchup",id:"Ikan saury, tomat, bawang bombay, minyak, arak, gula, saus tomat"},
    method:{zh:"秋刀魚去頭尾內臟切塊。番茄、洋蔥切丁。鍋中加油炒番茄、洋蔥，加調味料及秋刀魚拌勻，移至壓力鍋燉煮至軟爛（或電鍋每次外鍋一杯水燉煮、燜半小時，反覆2~3次至魚骨軟化）。",en:"Remove head, tail and innards from saury, cut into pieces. Dice tomato and onion. Sauté tomato and onion in oil, add seasoning and saury, mix well, pressure-cook until tender (or steam in a rice cooker with 1 cup water each round, resting 30 min, repeating 2-3 times until bones soften).",fil:"Alisin ang ulo, buntot, at lamang-loob ng saury, hiwain. Tadtarin ang kamatis at sibuyas. Igisa ang kamatis at sibuyas, idagdag ang timpla at saury, i-pressure cook hanggang malambot.",id:"Buang kepala, ekor, isi ikan saury, potong. Potong dadu tomat dan bawang bombay. Tumis tomat dan bawang, tambahkan bumbu dan ikan, aduk rata, masak presto hingga lunak (atau kukus bertahap hingga tulang lunak)."},
    note:{zh:"秋天是秋刀魚產季，魚骨煮至軟爛連魚肉一起食用可攝取鈣質。秋刀魚富含EPA、DHA及維生素B12，有助紅血球形成、增進神經系統健康。亦可用鯖魚代替秋刀魚。建議搭配適量米飯及蔬菜以達均衡營養。",en:"Autumn is saury season; softened bones eaten with the flesh provide calcium. Saury is rich in EPA, DHA, and vitamin B12, supporting red blood cell formation and nervous system health. Mackerel can substitute. Pair with rice and vegetables for balanced nutrition.",fil:"Tag-taglagas ang season ng saury; nagbibigay ng calcium ang malambot na buto. Mayaman sa EPA, DHA, at B12 ang saury para sa red blood cells at nervous system. Puwedeng palitan ng mackerel.",id:"Musim gugur adalah musim ikan saury; tulang lunak yang dimakan memberi kalsium. Saury kaya EPA, DHA, vitamin B12 untuk sel darah merah dan sistem saraf. Bisa diganti ikan makarel. Sajikan dengan nasi dan sayur untuk gizi seimbang."}},
  {month:11,emoji:"🍳",kcal:210,
    name:{zh:"菠菜起司烘蛋",en:"Spinach Cheese Baked Egg",fil:"Spinach Cheese Baked Egg",id:"Telur Panggang Bayam Keju"},
    ing:{zh:"菠菜200克(切段)、雞蛋2個、奶油1茶匙、大蒜片2瓣、番茄少許、橄欖油1茶匙、起司絲35克、鹽少許、胡椒粉少許",en:"Spinach 200g, 2 eggs, 1 tsp butter, 2 garlic cloves, tomato, 1 tsp olive oil, shredded cheese 35g, salt, pepper",fil:"Spinach, itlog, mantikilya, bawang, kamatis, olive oil, cheese, asin, paminta",id:"Bayam, telur, mentega, bawang putih, tomat, minyak zaitun, keju parut, garam, merica"},
    method:{zh:"菠菜切段。蛋打成蛋液加入菠菜。鍋加熱放奶油、蒜片，倒入蛋液料，鋪番茄、鹽、胡椒粉，淋橄欖油，中小火烘至5分熟，灑起司絲再加熱5分鐘至融化即可。",en:"Cut spinach into segments. Beat eggs and mix in spinach. Heat pan with butter and garlic, pour in egg mixture, top with tomato, salt, pepper, drizzle olive oil, cook on low-medium until half set, sprinkle cheese and cook 5 more minutes until melted.",fil:"Hiwain ang spinach. Paluin ang itlog, ihalo ang spinach. Init ang kawali na may mantikilya at bawang, ibuhos ang itlog, ilagay ang kamatis, asin, paminta, budburan ng olive oil, lutuin, budburan ng cheese hanggang matunaw.",id:"Potong bayam. Kocok telur, campur bayam. Panaskan wajan dengan mentega dan bawang putih, tuang adonan telur, tambahkan tomat, garam, merica, siram minyak zaitun, masak api kecil, taburi keju hingga meleleh."},

/* ---------- voice (real Web Speech API + mic permission) ----------
   注意：iOS Safari 對 SpeechRecognition.start() 有嚴格的「使用者手勢」要求，
   若在 start() 之前插入任何非同步流程（例如先呼叫 getUserMedia），
   iOS 會判定手勢已失效，導致辨識立刻觸發 onerror("aborted")。
   因此這裡改成在點擊當下「同步」直接呼叫 rec.start()，
   麥克風權限請求交給 SpeechRecognition 內部自行處理。 */
let activeRecognizer = null;
let voiceRetryCount = 0;
function voiceInput(targetSetter, btnEl){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("這個瀏覽器不支援語音辨識，建議改用電腦版或手機版 Chrome、或最新版 Safari 測試。");
    return;
  }
  if(!window.isSecureContext){
    alert("語音辨識需要在安全環境（https 或 localhost）下才能啟動麥克風，請確認網址是 https 開頭。");
    return;
  }
  if(activeRecognizer){ try{ activeRecognizer.stop(); }catch(e){} }
  const rec = new SR();
  const map = {zh:"zh-TW", en:"en-US", fil:"fil-PH", id:"id-ID"};
  rec.lang = map[state.lang] || "zh-TW";
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  activeRecognizer = rec;
  if(btnEl){ btnEl.setAttribute("aria-pressed","true"); btnEl.textContent="🔴"; btnEl.title="聆聽中，請說話..."; }
  rec.onresult = (e)=>{
    let finalTxt = "";
    for(let i=0;i<e.results.length;i++){ if(e.results[i].isFinal) finalTxt += e.results[i][0].transcript; }
    if(finalTxt){ voiceRetryCount=0; targetSetter(finalTxt); render(); }
  };
  rec.onerror = (e)=>{
    // iOS Safari 偶爾會在啟動瞬間丟出 aborted，通常再點一次就會正常，先自動重試一次不打擾使用者
    if(e.error === "aborted" && voiceRetryCount < 1){
      voiceRetryCount++;
      setTimeout(()=>{ try{ rec.start(); }catch(err){} }, 300);
      return;
    }
    voiceRetryCount = 0;
    const msgs = {
      "not-allowed":"麥克風權限被拒絕，請到瀏覽器（如 Safari）設定裡允許此網站使用麥克風後再試一次。",
      "no-speech":"沒有偵測到語音，請靠近麥克風、再點一次麥克風按鈕重新說話。",
      "audio-capture":"找不到可用的麥克風裝置，請確認裝置權限或改用其他裝置測試。",
      "network":"語音辨識需要網路連線，請確認網路狀態後再試。",
      "aborted":"語音辨識被中斷了，請再點一次麥克風按鈕重新開始。",
      "service-not-allowed":"目前的瀏覽器環境（可能是App內建瀏覽器）不允許使用語音服務，請改用獨立的 Safari 或 Chrome App 開啟此頁面再試一次。"
    };
    alert(msgs[e.error] || ("語音辨識發生錯誤：" + e.error));
  };
  rec.onend = ()=>{ if(btnEl){ btnEl.setAttribute("aria-pressed","false"); btnEl.textContent="🎙️"; btnEl.title=""; } activeRecognizer=null; };
  try{ rec.start(); }catch(err){ alert("無法啟動語音辨識：" + err.message); }
}
function micBtn(id, onText){
  return `<button class="mic-btn" id="${id}" aria-label="${t('micHint')}" aria-pressed="false" onclick="voiceInput(${onText}, this)">🎙️</button>`;
}

    <div class="video-frame">

/* 讓影片「滑到畫面可視範圍內才自動播放」：觀察 #screen 這個捲動容器裡的每支 iframe，
   進入可視範圍時才把網址換成帶 autoplay=1 的版本觸發播放（YouTube iframe 需要重新載入網址才能觸發自動播放）。 */
let scrollAutoplayObserver = null;
function setupScrollAutoplay(){
  const screenEl = document.getElementById('screen');
  const frames = screenEl.querySelectorAll('iframe.yt-scroll-autoplay');
  if(!frames.length) return;
  if(scrollAutoplayObserver) scrollAutoplayObserver.disconnect();
  scrollAutoplayObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const iframe = entry.target;
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6 && !iframe.dataset.played){
        iframe.dataset.played = "1";
        iframe.src = iframe.dataset.baseSrc + "&autoplay=1";
      }
    });
  }, {root:screenEl, threshold:0.6});
  frames.forEach(f=>scrollAutoplayObserver.observe(f));
}

/* ---------- LOG (共同紀錄 style) ---------- */
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function firstWeekday(y,m){ return new Date(y,m-1,1).getDay(); }
function renderLog(){
  const y=state.calYear, m=state.calMonth;
  const total = daysInMonth(y,m), startDow = firstWeekday(y,m);
  const dateStr = (d)=> `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const selDate = dateStr(state.calDay);
  const entries = DIET_LOG.filter(e=>e.date===selDate);
  const cellDays = [];
  for(let i=0;i<startDow;i++) cellDays.push(null);
  for(let d=1;d<=total;d++) cellDays.push(d);
  return `
  <div class="topbar"><h1>${t('navLog')}</h1><p>${t('navLogSub')}</p></div>
  ${a11yBar()}
  <div class="content">
    <div class="shared-note">${t('sharedNoteLog')}</div>
    <div class="cal-nav">
      <button aria-label="${t('prevMonth')}" onclick="changeMonth(-1)">‹</button>
      <strong>${y}年${m}月</strong>
      <button aria-label="${t('nextMonth')}" onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar">
      ${["日","一","二","三","四","五","六"].map(d=>`<div class="cal-h">${d}</div>`).join("")}
      ${cellDays.map(d=>{
        if(d===null) return `<div></div>`;
        const has = DIET_LOG.some(e=>e.date===dateStr(d));
        const sel = d===state.calDay;
        return `<button class="cal-d ${sel?'sel':''} ${has?'has':''}" onclick="state.calDay=${d};render()" aria-label="${m}月${d}日">${d}</button>`;
      }).join("")}
    </div>
    <button class="btn-primary" onclick="state.showLogForm=true;render()">${t('addEntry')}（${m}月${state.calDay}日）</button>
    ${state.showLogForm ? `
    <div class="card" style="margin-top:12px;">
      <h4>${t('newEntryTitle')}・${m}月${state.calDay}日</h4>
      <label class="f-label">${t('foodNameLabel')}</label>
      <div class="field-row"><input id="logFoodInput" value="${logDraft.food}" oninput="logDraft.food=this.value" placeholder="${t('foodNamePh')}">${micBtn('logMic',"(txt)=>{logDraft.food=txt;}")}</div>
      <label class="f-label">${t('categoryLabel')}</label>
      <div class="chip-row">${CATEGORIES.map(c=>`<div class="chip ${logDraft.cat===c.key?'active':''}" onclick="logDraft.cat='${c.key}';render()">${c.em} ${trField(c.name)}</div>`).join("")}</div>
      <label class="f-label">${t('recorderLabel')}</label>
      <input value="${logDraft.recorder}" oninput="logDraft.recorder=this.value" placeholder="${t('recorderPh')}">
      <label class="f-label">${t('noteOptionalLabel')}</label>
      <input value="${logDraft.note||''}" oninput="logDraft.note=this.value" placeholder="${t('logNotePh')}">
      <div class="btn-row"><button class="btn-primary" onclick="saveLog(${m},${state.calDay})">${t('saveBtn')}</button><button class="btn-ghost" onclick="state.showLogForm=false;render()">${t('cancelBtn')}</button></div>
    </div>` : ""}
    <div class="section-title">${m}月${state.calDay}日${t('entriesForDay')}（${entries.length}）</div>
    ${entries.length? entries.map(e=>`
      <div class="card">
        <h4 style="color:var(--ink);">${catEm(e.cat)} ${trField(e.food)}</h4>
        <p style="color:var(--sub);font-size:.75rem;">${t('recorderLabel')}：${e.recorder}｜${catName(e.cat)}</p>
        ${e.note?`<p style="margin-top:4px;">${trField(e.note)}</p>`:""}
      </div>`).join("") : `<div class="empty">${t('noEntriesForDate')}</div>`}
  </div>`;
}
function changeMonth(delta){
  let m = state.calMonth + delta, y = state.calYear;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  state.calMonth=m; state.calYear=y; state.calDay=1; render();
}
function saveLog(m,d){
  if(!logDraft.food || !logDraft.recorder){ alert("請至少填寫食物名稱與紀錄者"); return; }
  DIET_LOG.push({date:`${state.calYear}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, food:logDraft.food, cat:logDraft.cat, recorder:logDraft.recorder, note:logDraft.note||""});
  logDraft = {food:"",cat:"protein",recorder:""};
  state.showLogForm=false; render();
}

/* ---------- render dispatcher ---------- */
function render(){
  const screen = document.getElementById("screen");
  const tabbar = document.getElementById("tabbar");
  if(state.onb < 3){
    tabbar.hidden = true;
    screen.innerHTML = renderOnboarding();
    screen.scrollTop = 0;
    return;
  }
  tabbar.hidden = false;
  tabbar.innerHTML = `
    <button class="tab ${state.tab==='home'?'active':''}" onclick="goTab('home')"><div class="ic">🏠</div>${t('navHome')}</button>
    <button class="tab ${state.tab==='log'?'active':''}" onclick="goTab('log')"><div class="ic">📋</div>${t('navLog')}</button>
    <button class="tab ${state.tab==='recipe'?'active':''}" onclick="goTab('recipe')"><div class="ic">📝</div>${t('navRecipe')}</button>
    <button class="tab ${state.tab==='visit'?'active':''}" onclick="goTab('visit')"><div class="ic">🩺</div>${t('navVisit')}</button>
  `;
  if(state.tab==="home"){
    if(state.view==="home") screen.innerHTML = renderHome();
    else if(state.view==="selfTest") screen.innerHTML = renderSelfTest();
    else if(state.view==="selfTestDetail") screen.innerHTML = renderSelfTestDetail();
    else if(state.view==="menuRef") screen.innerHTML = renderMenuRef();
    else if(state.view==="menuGroupDetail") screen.innerHTML = renderMenuGroupDetail();
    else if(state.view==="levelDetail") screen.innerHTML = renderLevelDetail(state.levelN);
    else if(state.view==="categoryList") screen.innerHTML = renderCategoryList();
    else if(state.view==="recipeDetail") screen.innerHTML = renderRecipeDetail(state.recipeId);
    else if(state.view==="monthlyDetail") screen.innerHTML = renderMonthlyDetail(state.monthlyMonth);
  } else if(state.tab==="log"){ screen.innerHTML = renderLog(); }
  else if(state.tab==="recipe"){ screen.innerHTML = renderRecipeForm(); }
  else if(state.tab==="visit"){ screen.innerHTML = renderVisit(); }
  screen.scrollTop = 0;
  setupScrollAutoplay();
}
function goTab(tabName){ state.tab=tabName; state.view="home"; state.searchQuery=""; render(); }

render();
</script>
</body>
</html>
